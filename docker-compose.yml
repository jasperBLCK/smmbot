services:
  bot:
    build: .
    container_name: smmbot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/database.db
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_SERVER_PORT:-8001}:8001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
